# Fichier de configuration pour déployer BugHound sur Render (version corrigée)

databases:
  # Service pour la base de données PostgreSQL
  - name: bughound-db
    plan: free # Vous pouvez changer ce plan plus tard si besoin

services:
  # Service pour l'application web Ruby on Rails
  - type: web
    name: bughound-web
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        fromSecret: true
      - key: DATABASE_URL
        fromDatabase:
          name: bughound-db
          property: connectionString
