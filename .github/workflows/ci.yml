# Nom du workflow qui apparaîtra sur GitHub
name: Tests Ruby (RSpec)

# Événement qui déclenche ce workflow. Ici, à chaque "push".
on: [push]

# Liste des "jobs" (tâches) à exécuter.
jobs:
  test:
    # Nom du job qui apparaîtra sur GitHub
    name: Lancement de la suite de tests
    # Spécifie la machine virtuelle à utiliser. "ubuntu-latest" est le standard.
    runs-on: ubuntu-latest

    # Démarre les services dont on a besoin (Postgres)
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bughound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Liste des étapes à exécuter dans l'ordre pour ce job
    steps:
      # Étape 1 : Récupère le code de votre dépôt sur la machine virtuelle
      - name: 1. Récupérer le code du projet
        uses: actions/checkout@v4

      # Étape 2 : Installe Ruby
      - name: 2. Mettre en place l'environnement Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'

      # Étape 3 : Installer les dépendances
      - name: 3. Installer les dépendances
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      # NOUVELLE ÉTAPE AJOUTÉE ICI
      # Étape 4 : Générer les binstubs pour les exécutables des gems
      - name: 4. Générer les binstubs
        run: bundle binstubs rspec-core

      # Étape 5 : Préparer la base de données
      - name: 5. Préparer la base de données
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      # Étape 6 : Lancer les tests RSpec
      - name: 6. Lancer les tests RSpec
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bundle exec rspec
