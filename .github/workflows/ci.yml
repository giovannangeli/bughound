# Nom du workflow qui apparaîtra sur GitHub
name: Tests Ruby (RSpec)

# Événement qui déclenche ce workflow. Ici, à chaque "push".
on: [push]

# Liste des "jobs" (tâches) à exécuter.
jobs:
  test:
    # Nom du job qui apparaîtra sur GitHub
    name: Lancement de la suite de tests
    # Spécifie la machine virtuelle à utiliser. "ubuntu-latest" est le standard.
    runs-on: ubuntu-latest

    # Liste des étapes à exécuter dans l'ordre pour ce job
    steps:
      # Étape 1 : Récupère le code de votre dépôt sur la machine virtuelle
      - name: 1. Récupérer le code du projet
        uses: actions/checkout@v4 # J'ai mis à jour vers la dernière version v4

      # Étape 2 : Installe Ruby et met en cache les gems
      # "uses: ruby/setup-ruby@v1" est une action officielle pour simplifier l'installation.
      - name: 2. Mettre en place l'environnement Ruby
        uses: ruby/setup-ruby@v1
        with:
          # IMPORTANT : C'est la version de Ruby de votre projet, que j'ai vue dans votre Gemfile.
          ruby-version: '3.3.5'
          
      - name: 3. Installer les dépendances
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: 4. Préparer la base de données
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # <--- LIGNE AJOUTÉE
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: 5. Lancer les tests RSpec
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # <--- LIGNE AJOUTÉE
        run: bundle exec rspec